    <!-- Suppress disabled HMR WebSocket / Vite runner warnings in preview iframe -->
    <script>
      (function() {
        function shouldSuppress(msg) {
          var s = String(msg || '');
          return s.indexOf('WebSocket') !== -1 ||
                 s.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
                 s.indexOf('@vite/client') !== -1 ||
                 s.indexOf('24678') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (shouldSuppress(e.message || (e.error && e.error.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason && (e.reason.message || String(e.reason));
          if (shouldSuppress(reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
