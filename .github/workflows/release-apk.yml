name: Build & Publish Karbama Android APK to GitHub

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build APK & Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies & Build Web App + APK
        run: |
          npm install --legacy-peer-deps
          npm run build
          python3 scripts/generate-apk.py
          python3 scripts/zip-dist.py

      - name: 📤 Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: karbama-android-apk
          path: |
            karbama-latest.apk
            public/karbama-v*.apk
          retention-days: 90

      - name: 🚀 Publish APK & Build ZIP to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v10.0.0.12' }}
          name: "کارباما نسخه رسمی اندروید (APK) و وب‌اپلیکیشن"
          body: |
            ## 📱 نسخه رسمی اندروید کارباما (`app.karbama.twa`)

            فایل نصبی مستقیم اندروید (**APK**) و بسته کامل هاست (**dist.zip**) آماده دانلود است:

            ### 📥 فایل‌های پیوست‌شده در پایین صفحه (Assets):
            1. **`karbama-latest.apk`** / **`karbama-v10.0.0.12.apk`**: فایل نصبی مستقیم اندروید کارباما
            2. **`karbama-dist.zip`**: فایل زیپ آماده آپلود در `public_html` هاست شخصی (cPanel / DirectAdmin)
          files: |
            karbama-latest.apk
            public/karbama-v*.apk
            public/karbama-dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
