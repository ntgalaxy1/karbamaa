name: Build & Publish Karbama Android APK & AAB (Cafe Bazaar Ready)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build Signed APK + AAB & Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies & Build Web App + Signed APK & AAB
        run: |
          npm install --legacy-peer-deps
          npm run build
          python3 scripts/generate-apk.py
          python3 scripts/zip-dist.py

      - name: 📤 Upload APK & AAB to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: karbama-cafebazaar-bundle
          path: |
            karbama-latest.apk
            karbama-latest.aab
            public/karbama-v*.apk
            public/karbama-v*.aab
          retention-days: 90

      - name: 🚀 Publish APK, AAB & Build ZIP to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v10.0.0.18' }}
          name: "کارباما نسخه رسمی اندروید ویژه کافه‌بازار (APK + AAB v10.0.0.18)"
          body: |
            ## 📱 نسخه رسمی اندروید کارباما ویژه کافه‌بازار و نصب مستقیم (`app.karbama.twa`)

            فایل نصبی مستقیم اندروید (**APK**)، باندل استاندارد پیشخوان کافه‌بازار (**AAB**) و بسته کامل هاست (**dist.zip**) آماده دانلود است:

            ### 📋 مشخصات فنی نسخه:
            - **Package Name:** `app.karbama.twa`
            - **Version Name:** `10.0.0.18`
            - **Version Code:** `100018`
            - **Signature:** `V1 (JAR) + V2 (APK Signature Scheme v2)`

            ### 📥 فایل‌های پیوست‌شده در پایین صفحه (Assets):
            1. **`karbama-v10.0.0.18.apk`** / **`karbama-latest.apk`**: فایل نصبی اندروید مناسب آپلود در کافه‌بازار (بخش APK) و نصب مستقیم
            2. **`karbama-v10.0.0.18.aab`** / **`karbama-latest.aab`**: فایل App Bundle مناسب آپلود در پیشخوان کافه‌بازار (بخش AAB)
            3. **`karbama-dist.zip`**: فایل زیپ آماده آپلود در `public_html` هاست شخصی (cPanel / DirectAdmin)
          files: |
            karbama-latest.apk
            karbama-latest.aab
            public/karbama-v*.apk
            public/karbama-v*.aab
            public/karbama-dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
